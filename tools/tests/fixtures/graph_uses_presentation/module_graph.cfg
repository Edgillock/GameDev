; sim, a game-rules module, uses the ui module (forbidden). editor, another presentation
; module, and the app may use it (allowed).
[app]
path="res://game/scenes"
kind="app"
uses=["*"]

[core]
path="res://game/core"
kind="core"
uses=[]

[ui]
path="res://game/modules/ui"
kind="presentation"
uses=["core"]

[editor]
path="res://game/modules/editor"
kind="presentation"
uses=["core", "ui"]

[sim]
path="res://game/modules/sim"
kind="simulation"
uses=["core", "ui"]
