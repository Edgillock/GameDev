; Shared fixture graph: beta uses alpha; controls is the presentation module; the app uses everything.
[app]
path="res://game/scenes"
kind="app"
uses=["*"]

[core]
path="res://game/core"
kind="core"
uses=[]

[alpha]
path="res://game/modules/alpha"
kind="data"
uses=["core"]

[beta]
path="res://game/modules/beta"
kind="simulation"
uses=["core", "alpha"]

[controls]
path="res://game/modules/controls"
kind="presentation"
uses=["core", "beta"]
