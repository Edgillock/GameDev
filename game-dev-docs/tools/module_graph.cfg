; Module dependency graph — the single source of truth for what may use what.
; Owned by the project owner. Claude may NOT edit this file unless the owner asks in so many words.
; tools/check_boundaries reads it. A module may reference game/core, and only the <key>_api.gd
; and public/ folder of the modules listed in its `uses`. `presentation` modules may not be used
; by any non-presentation module. The graph must stay acyclic.

[app]
id="M00"
path="res://game/scenes"
kind="app"
uses=["*"]

[core]
id="M01"
path="res://game/core"
kind="core"
uses=[]

[blueprint]
id="M02"
path="res://game/modules/blueprint"
kind="data"
uses=["core"]

[structure]
id="M03"
path="res://game/modules/structure"
kind="data"
uses=["core", "blueprint"]

[vehicle]
id="M04"
path="res://game/modules/vehicle"
kind="simulation"
uses=["core", "blueprint", "structure"]

[mobility]
id="M05"
path="res://game/modules/mobility"
kind="simulation"
uses=["core", "vehicle"]

[controls]
id="M06"
path="res://game/modules/controls"
kind="presentation"
uses=["core", "vehicle", "ai"]

[builder]
id="M07"
path="res://game/modules/builder"
kind="presentation"
uses=["core", "blueprint", "structure", "vehicle", "controls", "power", "weapons", "detection"]

[power]
id="M08"
path="res://game/modules/power"
kind="simulation"
uses=["core", "blueprint", "vehicle"]

[damage]
id="M09"
path="res://game/modules/damage"
kind="simulation"
uses=["core", "vehicle", "structure"]

[weapons]
id="M10"
path="res://game/modules/weapons"
kind="simulation"
uses=["core", "blueprint", "vehicle", "power", "damage"]

[detection]
id="M11"
path="res://game/modules/detection"
kind="simulation"
uses=["core", "blueprint", "vehicle"]

[crew]
id="M12"
path="res://game/modules/crew"
kind="simulation"
uses=["core", "vehicle"]

[world]
id="M13"
path="res://game/modules/world"
kind="meta"
uses=["core", "vehicle", "damage"]

[ai]
id="M14"
path="res://game/modules/ai"
kind="simulation"
uses=["core", "vehicle", "mobility", "weapons", "detection", "crew"]

[save]
id="M15"
path="res://game/modules/save"
kind="meta"
uses=["core"]

[progression]
id="M16"
path="res://game/modules/progression"
kind="meta"
uses=["core"]

[economy]
id="M17"
path="res://game/modules/economy"
kind="meta"
uses=["core", "blueprint", "progression"]

[logistics]
id="M18"
path="res://game/modules/logistics"
kind="meta"
uses=["core", "vehicle", "ai", "economy"]

[hud]
id="M19"
path="res://game/modules/hud"
kind="presentation"
uses=["core", "vehicle", "power", "weapons", "detection", "crew", "world", "ai", "economy", "progression", "logistics"]

[story]
id="M20"
path="res://game/modules/story"
kind="meta"
